name: Back-end CD

on:
  pull_request:
    branches:
      - "master"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [14.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: yarn install
        working-directory: ./backend
      - run: yarn build
        working-directory: ./backend
      - run: yarn test
        working-directory: ./backend
      - uses: akhileshns/heroku-deploy@v3.12.12
        with:
          heroku_api_key: ${{secrets.HEROKU_API_KEY}}
          heroku_app_name: "homespring-challenge-backend"
          heroku_email: "andre.schumacher.treib@gmail.com"
          appdir: backend
