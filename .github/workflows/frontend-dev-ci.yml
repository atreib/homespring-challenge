name: Front-end CI
on:
  pull_request:
    branches:
      - "develop"
    paths:
      - "frontend/**"

jobs:
  test:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2-beta
        with:
          node-version: "16.6.2"
          check-latest: true

      - name: Install Npm Dependencies
        run: yarn install

      - name: Build App
        run: yarn build

      - name: Cypress.io
        uses: cypress-io/github-action@v2
        with:
          start: yarn start
          wait-on: "http://localhost:3000"
